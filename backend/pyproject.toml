[project]
name = "covenant-backend"
version = "0.1.0"
description = "Covenant API, job runner and AI pipelines"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.6",
    "alembic==1.20.1",
    "asyncmy==0.2.17",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "limits==5.8.0",
    "a2a-sdk==1.3.0",
    "langchain==1.4.8",
    "langchain-core==1.7.4",
    "langsmith==0.14.17",
    "jsonschema==4.26.0",
    "langdetect==1.0.9",
]

[project.optional-dependencies]
# LangChain integrations for the AI_PROVIDER options in .env.example; imported lazily.
providers = [
    "langchain-openai==1.7.3",
    "langchain-anthropic==1.7.9",
    "langchain-google-genai==4.4.2",
    "langchain-mistralai==1.1.6",
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "respx==0.23.1",
    "hypothesis==6.170.14",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "types-jsonschema==4.26.0.20261006",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions/*.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "RUF", "ASYNC", "DTZ", "T20"]
ignore = [
    "B008",  # FastAPI dependencies are declared as argument defaults
    "N818",  # exception names describe the condition (DatabaseUnavailable), not "...Error"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["T20"]
"evals/**" = ["T20"]
"migrations/env.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["langdetect", "langdetect.*", "a2a", "a2a.*", "langgraph", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
